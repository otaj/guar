# Signed split-per-ABI APKs on version tags (vX.Y.Z).
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          missing=()
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required repository secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Set version from pubspec
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          eval "$(./scripts/fdroid_build.sh --print-pubspec)"
          tag="${TAG_NAME#v}"
          tag="${tag%%+*}"
          if [[ "$tag" != "$VERSION_NAME" ]]; then
            echo "Release tag '$TAG_NAME' does not match pubspec versionName '$VERSION_NAME'."
            echo "Bump packages/guar/pubspec.yaml version and tag v${VERSION_NAME} on that commit."
            exit 1
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE_BASE=${VERSION_CODE_BASE}" >> "$GITHUB_ENV"
          echo "Set version to ${VERSION_NAME} (version-code-base ${VERSION_CODE_BASE})"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > packages/guar/guar-release.jks
          printf '%s\n' \
            "storePassword=${STORE_PASSWORD}" \
            "keyPassword=${KEY_PASSWORD}" \
            "keyAlias=${KEY_ALIAS}" \
            "storeFile=../../guar-release.jks" \
            > packages/guar/android/key.properties

      - name: Build per-ABI release APKs
        env:
          # subosito/flutter-action sets this to $HOME/.pub-cache on Linux.
          # Pin it so F-Droid can use the same path for reproducible builds.
          PUB_CACHE: /home/runner/.pub-cache
        run: |
          set -euo pipefail
          for platform in android-arm android-arm64 android-x64; do
            ./scripts/fdroid_build.sh "$platform"
          done

      - name: Rename APKs for release
        run: |
          set -euo pipefail
          mkdir -p release-apks
          shopt -s nullglob
          apks=(packages/guar/build/app/outputs/flutter-apk/app-*-release.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No split APKs found under packages/guar/build/app/outputs/flutter-apk/"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            base=$(basename "$apk")
            if [ "$base" = "app-release.apk" ]; then
              continue
            fi
            abi=${base#app-}
            abi=${abi%-release.apk}
            dest="release-apks/guar-${VERSION_NAME}-${abi}.apk"
            cp "$apk" "$dest"
            echo "Prepared $dest"
          done

      - name: Ensure no proprietary Google libraries
        run: ./scripts/check_no_google_libs.sh release-apks/*.apk

      - name: Upload APKs to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
