# Lint, analyze, test, and outdated-deps checks (no Android flavor).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: latest-known

      - name: Lint shell scripts
        # Keep shellcheck-py pin in sync with .pre-commit-config.yaml.
        run: uvx --from shellcheck-py==0.11.0.1 shellcheck scripts/*.sh

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: latest-known

      - name: Ruff check
        # Keep ruff pin in sync with .pre-commit-config.yaml.
        run: uvx ruff==0.16.4 check

      - name: Ruff format
        run: uvx ruff==0.16.4 format --check

  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Generate code
        run: ./scripts/generate.sh

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Dart
        run: dart analyze --fatal-warnings --fatal-infos

      - name: Check outdated packages
        run: python3 scripts/check_pub_outdated.py

      - name: Test
        run: ./scripts/test.sh
