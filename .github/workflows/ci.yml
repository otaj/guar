# Lint, analyze, test, and (on main) debug split-per-ABI APKs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: latest-known

      - name: Lint shell scripts
        # Keep shellcheck-py pin in sync with .pre-commit-config.yaml.
        run: uvx --from shellcheck-py==0.11.0.1 shellcheck scripts/*.sh

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: latest-known

      - name: Ruff check
        # Keep ruff pin in sync with .pre-commit-config.yaml.
        run: uvx ruff==0.16.4 check

      - name: Ruff format
        run: uvx ruff==0.16.4 format --check

  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: latest-known

      - name: Check pubspec versionCode
        run: ./scripts/check_pubspec_version_code.sh

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Restore generated Dart
        id: codegen
        uses: actions/cache/restore@v6
        with:
          path: |
            packages/guar_parser/.dart_tool/build
            packages/guar_parser/.dart_tool/build_resolvers
            packages/guar_domain/.dart_tool/build
            packages/guar_domain/.dart_tool/build_resolvers
            packages/guar_query/.dart_tool/build
            packages/guar_query/.dart_tool/build_resolvers
            packages/guar_parser/**/*.freezed.dart
            packages/guar_domain/**/*.freezed.dart
            packages/guar_query/**/*.freezed.dart
          key: codegen-${{ runner.os }}-${{ hashFiles('.fvmrc', 'pubspec.lock', 'pubspec.yaml', 'packages/guar_parser/pubspec.yaml', 'packages/guar_parser/lib/**/*.dart', 'packages/guar_domain/pubspec.yaml', 'packages/guar_domain/lib/**/*.dart', 'packages/guar_query/pubspec.yaml', 'packages/guar_query/lib/**/*.dart') }}
          restore-keys: |
            codegen-${{ runner.os }}-

      - name: Generate code
        if: steps.codegen.outputs.cache-hit != 'true'
        run: ./scripts/generate.sh

      - name: Save generated Dart
        if: steps.codegen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            packages/guar_parser/.dart_tool/build
            packages/guar_parser/.dart_tool/build_resolvers
            packages/guar_domain/.dart_tool/build
            packages/guar_domain/.dart_tool/build_resolvers
            packages/guar_query/.dart_tool/build
            packages/guar_query/.dart_tool/build_resolvers
            packages/guar_parser/**/*.freezed.dart
            packages/guar_domain/**/*.freezed.dart
            packages/guar_query/**/*.freezed.dart
          key: ${{ steps.codegen.outputs.cache-primary-key }}

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Dart
        run: dart analyze --fatal-warnings --fatal-infos

      - name: Analyze Kotlin
        run: |
          set -euo pipefail
          # detekt CLI — avoids booting AGP / compiling Flutter's Gradle
          # includeBuild / resolving the Android dependency graph (~4+ min).
          ./scripts/analyze_kotlin.sh

      - name: Check outdated packages
        run: python3 scripts/check_pub_outdated.py

      - name: Test
        run: ./scripts/test.sh

  debug-apk:
    name: Debug APKs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Build debug split-per-ABI APKs
        working-directory: packages/guar
        run: flutter build apk --debug --split-per-abi

      - name: Rename APKs
        id: apks
        run: |
          set -euo pipefail
          eval "$(./scripts/fdroid_build.sh --print-pubspec)"
          mkdir -p debug-apks
          shopt -s nullglob
          apks=(packages/guar/build/app/outputs/flutter-apk/app-*-debug.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No split debug APKs found under packages/guar/build/app/outputs/flutter-apk/"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            base=$(basename "$apk")
            if [ "$base" = "app-debug.apk" ]; then
              continue
            fi
            abi=${base#app-}
            abi=${abi%-debug.apk}
            dest="debug-apks/guar-debug-${VERSION_NAME}-${abi}.apk"
            cp "$apk" "$dest"
            echo "Prepared $dest"
          done
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Ensure no proprietary Google libraries
        env:
          GRADLE_CONFIGURATION: debugRuntimeClasspath
          # Unminified debug DEX still contains Flutter's Play Store deferred-
          # component stub (Lcom/google/android/play/) without a Play SDK dep.
          SKIP_DEX: "1"
        run: ./scripts/check_no_google_libs.sh debug-apks/*.apk

      - name: Upload armeabi-v7a APK
        uses: ./.github/actions/upload-apk
        with:
          version: ${{ env.VERSION_NAME }}
          abi: armeabi-v7a
          prefix: guar-debug
          directory: debug-apks

      - name: Upload arm64-v8a APK
        uses: ./.github/actions/upload-apk
        with:
          version: ${{ env.VERSION_NAME }}
          abi: arm64-v8a
          prefix: guar-debug
          directory: debug-apks

      - name: Upload x86_64 APK
        uses: ./.github/actions/upload-apk
        with:
          version: ${{ env.VERSION_NAME }}
          abi: x86_64
          prefix: guar-debug
          directory: debug-apks
