# Explicit skip list for beanquery-ported query tests.
# Product skips need an explicit reason; use for CREATE TABLE / INSERT / CSV execution.
unmigrated: []
product:
  - case: execute_create_table
    reason: CREATE TABLE / INSERT / CSV sources parse but are not executed
  - case: execute_insert
    reason: CREATE TABLE / INSERT / CSV sources parse but are not executed
  - case: execute_csv_table
    reason: CREATE TABLE / INSERT / CSV sources parse but are not executed
  - case: execute_generic_test_table
    reason: generic in-memory #test tables are out of scope
