default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--verbose]
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: bash -c 'fvm dart format --set-exit-if-changed --line-length 120 "$@"' --
        language: system
        types: [dart]
      - id: dart-analyze
        name: dart analyze
        entry: bash -c 'cd packages/guar_parser && fvm dart analyze --fatal-infos'
        language: system
        types: [dart]
        pass_filenames: false
